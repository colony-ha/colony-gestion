name: Build COLONY GESTION Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'package.json'
      - 'capacitor.config.ts'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Build web application
        run: npm run build
      - name: Add Android platform
        run: npx cap add android
      - name: Sync Capacitor assets
        run: npx cap sync android
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - name: Generate complete COLONY launcher icons without cropping
        shell: bash
        run: |
          npm install --no-save sharp
          node <<'NODE'
          const sharp = require('sharp');
          const fs = require('fs');
          const path = require('path');
          const source = 'public/colony-icon.svg';
          const res = 'android/app/src/main/res';
          const sizes = [
            ['mipmap-mdpi', 48],
            ['mipmap-hdpi', 72],
            ['mipmap-xhdpi', 96],
            ['mipmap-xxhdpi', 144],
            ['mipmap-xxxhdpi', 192],
          ];
          (async () => {
            for (const [folder, size] of sizes) {
              const dir = path.join(res, folder);
              fs.mkdirSync(dir, { recursive: true });
              const png = await sharp(source).resize(size, size, { fit: 'contain', background: '#090A09' }).png().toBuffer();
              fs.writeFileSync(path.join(dir, 'ic_launcher.png'), png);
              fs.writeFileSync(path.join(dir, 'ic_launcher_round.png'), png);
            }
            // Adaptive foreground: keep the entire original square logo inside Android's safe zone.
            const foreground = await sharp({
              create: { width: 432, height: 432, channels: 4, background: { r: 0, g: 0, b: 0, alpha: 0 } }
            }).composite([{
              input: await sharp(source).resize(300, 300, { fit: 'contain' }).png().toBuffer(),
              left: 66,
              top: 66
            }]).png().toBuffer();
            const drawableDir = path.join(res, 'drawable-nodpi');
            fs.mkdirSync(drawableDir, { recursive: true });
            fs.writeFileSync(path.join(drawableDir, 'ic_launcher_foreground.png'), foreground);
            const anydpi = path.join(res, 'mipmap-anydpi-v26');
            fs.mkdirSync(anydpi, { recursive: true });
            fs.writeFileSync(path.join(anydpi, 'ic_launcher.xml'),
              '<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android"><background android:drawable="@color/ic_launcher_background"/><foreground android:drawable="@drawable/ic_launcher_foreground"/></adaptive-icon>');
            fs.writeFileSync(path.join(anydpi, 'ic_launcher_round.xml'),
              '<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android"><background android:drawable="@color/ic_launcher_background"/><foreground android:drawable="@drawable/ic_launcher_foreground"/></adaptive-icon>');
            const values = path.join(res, 'values');
            fs.mkdirSync(values, { recursive: true });
            fs.writeFileSync(path.join(values, 'ic_launcher_background.xml'),
              '<resources><color name="ic_launcher_background">#090A09</color></resources>');
            const oldVector = path.join(drawableDir, 'ic_colony_foreground.xml');
            if (fs.existsSync(oldVector)) fs.unlinkSync(oldVector);
          })().catch(error => { console.error(error); process.exit(1); });
          NODE
      - name: Build debug APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug
      - name: Rename APK for easy installation
        run: cp android/app/build/outputs/apk/debug/app-debug.apk android/app/build/outputs/apk/debug/colony_gestion.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: COLONY_GESTION
          path: android/app/build/outputs/apk/debug/colony_gestion.apk
          if-no-files-found: error
          retention-days: 30
