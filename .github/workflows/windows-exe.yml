name: Build COLONY GESTION Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'electron/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/windows-exe.yml'

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Build application
        run: npm run build
      - name: Generate COLONY GESTION Windows icon
        shell: pwsh
        run: |
          npm install --no-save sharp
          New-Item -ItemType Directory -Force build | Out-Null
          node -e "const sharp=require('sharp');const fs=require('fs');(async()=>{const png=await sharp('public/colony-icon.svg').resize(256,256,{fit:'contain',background:'#050505'}).png().toBuffer();const h=Buffer.alloc(22);h.writeUInt16LE(0,0);h.writeUInt16LE(1,2);h.writeUInt16LE(1,4);h[6]=0;h[7]=0;h[8]=0;h[9]=0;h.writeUInt16LE(1,10);h.writeUInt16LE(32,12);h.writeUInt32LE(png.length,14);h.writeUInt32LE(22,18);fs.writeFileSync('build/colony.ico',Buffer.concat([h,png]));})();"
      - name: Create Windows installer
        run: npx electron-builder --win nsis --x64 --publish never
      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: COLONY_GESTION_WINDOWS
          path: release/*.exe
          if-no-files-found: error
          retention-days: 30
